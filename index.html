function note(id, text, ok) {
  const m = $(id);
  if (!m) return;
  m.textContent = text;
  m.className = `mt-4 rounded-xl p-3 text-sm ${ok ? "bg-emerald-50 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-200" : "bg-amber-50 text-amber-800 dark:bg-amber-900/30 dark:text-amber-200"}`;
}

/* ---------- Notebook (browser localStorage) ---------- */
const loadNb = () => { try { return JSON.parse(localStorage.getItem("nv-notebook") || "[]"); } catch (e) { return []; } };
function saveNb(list) { try { localStorage.setItem("nv-notebook", JSON.stringify(list)); return true; } catch (e) { return false; } }
function addNb(item) { const l = loadNb(); l.unshift(item); return saveNb(l); }

/* ---------- Uploader ---------- */
function uploaderHTML(p) {
  return `<div id="dz-${p}" class="rounded-2xl border-2 border-dashed border-brand-600/40 bg-white p-6 text-center dark:bg-slate-900">
    <div class="text-3xl">📤</div>
    <p class="mt-2 font-semibold">${t("dropText")}</p>
    <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">${t("fileRules")}</p>
    <button data-choose="${p}" class="${BTNS} mt-3">${t("chooseFiles")}</button>
    <input type="file" id="in-${p}" accept="image/jpeg,image/png,image/webp,application/pdf" multiple class="hidden" />
  </div>
  <p id="err-${p}" class="mt-2 text-sm text-red-600 dark:text-red-400"></p>
  <div id="grid-${p}" class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4"></div>`;
}
function mountUp(p) {
  const el = $("up-" + p);
  if (!el) return;
  el.innerHTML = uploaderHTML(p);
  renderUp(p);
}
function renderUp(p) {
  const g = $("grid-" + p);
  if (!g) return;
  g.innerHTML = (ups[p] || []).map((f, i) => `
    <div class="rounded-xl bg-white p-2 ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
      ${f.url ? `<img src="${f.url}" alt="" class="h-24 w-full rounded-lg object-cover" />` : `<div class="grid h-24 place-items-center rounded-lg bg-slate-100 text-3xl dark:bg-slate-800">📄</div>`}
      <p class="mt-1 truncate text-xs">${esc(f.name)}</p>
      <button data-up="${p}" data-remove="${i}" class="mt-1 w-full rounded-lg px-2 py-1 text-xs text-red-600 ring-1 ring-red-200 dark:text-red-300 dark:ring-red-900">${t("removeBtn")}</button>
    </div>`).join("");
}
function addFiles(p, list) {
  ups[p] = ups[p] || [];
  const errs = [];
  for (const f of Array.from(list)) {
    if (ups[p].length >= MAX_FILES) { errs.push(t("errCount")); break; }
    if (!ALLOWED.includes(f.type)) { errs.push(`${f.name}: ${t("errType")}`); continue; }
    if (f.size > MAX_SIZE) { errs.push(`${f.name}: ${t("errSize")}`); continue; }
    ups[p].push({ file: f, name: f.name, url: f.type === "application/pdf" ? null : URL.createObjectURL(f) });
  }
  if ($("err-" + p)) $("err-" + p).textContent = errs.join(" | ");
  renderUp(p);
}
function removeFile(p, i) {
  const f = ups[p] && ups[p][i];
  if (f && f.url) URL.revokeObjectURL(f.url);
  ups[p].splice(i, 1);
  renderUp(p);
}
function clearUp(p) {
  (ups[p] || []).forEach(f => f.url && URL.revokeObjectURL(f.url));
  ups[p] = [];
  renderUp(p);
}
const readFile = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = rej;
  r.readAsDataURL(f);
});
async function snapshot(p) {
  const out = [];
  for (const f of ups[p] || []) {
    if (f.file.size > MAX_STORE) { out.push({ name: f.name, type: f.file.type, skipped: true }); continue; }
    out.push({ name: f.name, type: f.file.type, data: await readFile(f.file) });
  }
  return out;
}

    <select id="subj" data-draft="subj" class="${INPUT}">${SUBJ.map((s, i) => `<option value="${i}">${L(s)}</option>`).join("")}</select></label>`;

function chapterHTML() {

    <input id="chap" data-draft="chap" class="${INPUT}" placeholder="${t("chapterPh")}" /></label>`;

const meta = () => ({

async function saveFiles(p, kind, msgId, extra = {}) {
  if (!(ups[p] || []).length) return note(msgId, t("needFiles"), false);
  const files = await snapshot(p);
  const ok = addNb({ id: Date.now(), kind, createdAt: new Date().toISOString(), ...meta(), ...extra, files });
  note(msgId, ok ? t("saveDone") : t("saveFail"), ok);
}

async function callAI(path, body) {
  const r = await fetch(AI_BASE + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

const validQs = arr => Array.isArray(arr) && arr.length > 0 && arr.every(q =>
  q && typeof q.q === "string" && Array.isArray(q.options) && q.options.length === 4 &&
  Number.isInteger(q.answer) && q.answer >= 0 && q.answer <= 3);

function setQs(arr) {
  quiz = { qs: arr.map(q => ({ ...q })), ans: {}, done: false, score: null };
  note("msg", t("loaded"), true);
  renderQuiz();
}

function loadJson() {
  try {
    const arr = JSON.parse($("jsonIn").value);
    if (!validQs(arr)) throw new Error("bad");
    setQs(arr);
  } catch (e) {
    note("msg", t("jsonErr"), false);
  }
}

async function genMcq() {
  if (!AI_BASE) return note("msg", t("noKey"), false);
  note("msg", t("busy"), true);
  try {
    const r = await callAI("/generate-mcq", { ...meta(), count: 20, lang });
    if (!validQs(r.questions)) throw new Error("bad");
    setQs(r.questions);
  } catch (e) {
    note("msg", t("aiErr"), false);
  }
}

function renderQuiz() {
  if (!$("quiz")) return;
  const n = quiz.qs.length;
  $("quiz").innerHTML = quiz.qs.map((q, i) => {
    const picked = quiz.ans[i];
    return `<div class="${CARD}">
      <p class="font-semibold">${i + 1}. ${esc(q.q)}</p>
      <div class="mt-3 grid gap-2">${q.options.map((o, j) => {
        let cls = "border-slate-300 dark:border-slate-700";
        if (quiz.done) {
          if (j === q.answer) cls = "border-emerald-500 bg-emerald-50 dark:bg-emerald-900/30";
          else if (j === picked) cls = "border-red-500 bg-red-50 dark:bg-red-900/30";
        } else if (picked === j) cls = "border-brand-600 bg-brand-50 dark:bg-slate-800";
        return `<button data-q="${i}" data-o="${j}" ${quiz.done ? "disabled" : ""} class="rounded-xl border px-3 py-2 text-left text-sm ${cls}">${String.fromCharCode(65 + j)}. ${esc(o)}</button>`;
      }).join("")}</div>
      ${quiz.done && q.explain ? `<p class="mt-3 text-sm text-slate-600 dark:text-slate-400">${t("explain")}: ${esc(q.explain)}</p>` : ""}
    </div>`;
  }).join("");
  $("qCount").textContent = `${n} ${t("qCount")}`;
  $("minNote").textContent = n < 20 ? t("minQ") : "";
  $("submitQuiz").disabled = quiz.done || n < 20;
  $("score").innerHTML = quiz.done && quiz.score
    ? `<div class="${CARD} text-center"><p class="text-lg font-bold">${t("correct")}: ${quiz.score.c}/${quiz.score.total} · ${quiz.score.pct}%</p></div>`
    : "";
}

function submitQuiz() {
  if (quiz.qs.length < 20) return note("msg", t("minQ"), false);
  const c = quiz.qs.filter((q, i) => quiz.ans[i] === q.answer).length;
  quiz.score = { c, total: quiz.qs.length, pct: Math.round((c / quiz.qs.length) * 100) };
  quiz.done = true;
  renderQuiz();
}

async function saveQuizResult() {

}

  $("view").innerHTML = `

  <div class="mt-4 flex flex-col gap-4">${list.length ? list.map(nbCard).join("") : `<p class="text-sm text-slate-500">${t("nbEmpty")}</p>`}</div>`;

function nbCard(it) {
  const files = it.files || [];
  const thumbs = files.filter(f => f.data && f.type !== "application/pdf")
    .map(f => `<img src="${f.data}" alt="" class="h-24 w-full rounded-lg object-cover" />`).join("");
  const pdfs = files.filter(f => f.type === "application/pdf")
    .map(f => `<span class="mr-2 text-xs">📄 ${esc(f.name)}</span>`).join("");
  let body = "";
  if (it.score) body += `<p class="text-sm font-semibold">${t("correct")}: ${it.score.c}/${it.score.total} (${it.score.pct}%)</p>`;
  if (it.question) body += `<p class="mt-2 text-sm"><b>Q:</b> ${esc(it.question)}</p>`;
  if (it.answer) body += `<p class="mt-1 whitespace-pre-wrap text-sm">${esc(it.answer)}</p>`;
  if (it.report) body += `<p class="mt-1 text-sm">${t("marks")}: ${esc(it.report.marks)} / ${esc(it.report.maxMarks)}</p>`;
  if (it.notes) body += `<div class="mt-2 whitespace-pre-wrap text-sm">${esc(it.notes)}</div>`;
  return `<div class="${CARD}">
    <div class="flex items-start justify-between gap-3">
      <div><p class="font-semibold">${L(KIND[it.kind] || ["Item", "आइटम"])}</p>
      <p class="text-xs text-slate-500 dark:text-slate-400">${esc((it.createdAt || "").slice(0, 10))} ${esc(it.subject || "")} ${esc(it.chapter || "")}</p></div>
      <button data-del="${it.id}" class="text-xs text-red-600 dark:text-red-300">${t("delBtn")}</button>
    </div>
    ${body}
    <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4">${thumbs}</div>${pdfs}
  </div>`;
}

function renderSoon(key) {
  const f = FEATURES.find(x => x.k === key);
  $("view").innerHTML = `<div class="${CARD} mx-auto mt-16 max-w-md text-center">
    <h1 class="text-xl font-bold">${f ? L(f.n) : ""}</h1>
    <p class="mt-2 text-sm text-slate-500">${t("soonText")}</p>
    <a href="#/" class="mt-4 inline-block ${BTN2}">${t("home")}</a></div>`;
}

function renderAuth(kind) {
  $("view").innerHTML = `<div class="${CARD} mx-auto mt-24 max-w-sm text-center">
    <h1 class="text-xl font-bold">${kind === "login" ? t("authLogin") : t("authSignup")}</h1>
    <p class="mt-2 text-sm text-slate-500">${t("authNote")}</p>
    <a href="#/demo" class="mt-4 inline-block ${BTN2}">${t("tryDemo")}</a>
    <a href="#/" class="mt-4 ml-2 inline-block ${BTN2}">${t("home")}</a></div>`;
}

/* ---------- Router + global events ---------- */
function applyStatic() {
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $("langBtn").textContent = lang === "en" ? "हिं" : "EN";
  $("themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";
  document.documentElement.lang = lang;
  document.documentElement.classList.toggle("dark", theme === "dark");
}

function route() {
  const parts = (location.hash || "#/").split("/");
  const page = parts[1] || "";
  applyStatic();
  if (page === "demo") renderDash();
  else if (page === "photo") renderPhoto();
  else if (page === "notes") renderNotes();
  else if (page === "objective") renderObjective();
  else if (page === "subjective") renderSubjective();
  else if (page === "notebook") renderNotebook();
  else if (page === "login" || page === "signup") renderAuth(page);
  else if (page === "soon") renderSoon(parts[2]);
  else renderHome();
  document.querySelectorAll("[data-draft]").forEach(el => {
    if (draft[el.dataset.draft] !== undefined) el.value = draft[el.dataset.draft];
  });
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const c = e.target.closest("[data-choose]");
  if (c) return $("in-" + c.dataset.choose).click();
  const r = e.target.closest("[data-remove]");
  if (r) return removeFile(r.dataset.up, Number(r.dataset.remove));
  const cl = e.target.closest("[data-clear]");
  if (cl) return clearUp(cl.dataset.clear);
  const del = e.target.closest("[data-del]");
  if (del) {
    saveNb(loadNb().filter(x => String(x.id) !== del.dataset.del));
    return renderNotebook();
  }
  const q = e.target.closest("button[data-q]");
  if (q && !quiz.done) {
    quiz.ans[Number(q.dataset.q)] = Number(q.dataset.o);
    renderQuiz();
  }
});
document.addEventListener("change", e => {
  if (e.target.matches("input[type=file]")) {
    addFiles(e.target.id.slice(3), e.target.files);
    e.target.value = "";
  } else if (e.target.dataset && e.target.dataset.draft) {
    draft[e.target.dataset.draft] = e.target.value;
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset && e.target.dataset.draft) draft[e.target.dataset.draft] = e.target.value;
});
document.addEventListener("dragover", e => { if (e.target.closest("[id^='dz-']")) e.preventDefault(); });
document.addEventListener("drop", e => {
  const z = e.target.closest("[id^='dz-']");
  if (z) { e.preventDefault(); addFiles(z.id.slice(3), e.dataTransfer.files); }
});

$("langBtn").addEventListener("click", () => {
  lang = lang === "en" ? "hi" : "en";
  localStorage.setItem("nv-lang", lang);
  route();
});
$("themeBtn").addEventListener("click", () => {
  theme = theme === "light" ? "dark" : "light";
  localStorage.setItem("nv-theme", theme);
  applyStatic();
});
window.addEventListener("hashchange", route);

route();
</script>
</body>
</html>
